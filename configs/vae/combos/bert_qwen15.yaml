# Combo: BERT encoder + Qwen2.5-1.5B decoder.
# Layer OVER base.yaml + default.yaml. Small + OPEN (no HF gating), so it keeps your
# FULL recipe — LoRA on, lr=1e-3 — consistent with the GPT-2 combo, and trains
# stably on a single GPU (unlike the 3B/7B decoders). Qwen2.5 is also LangVAE's
# decoder family (they used Qwen2.5-3B), so this is a same-family, trainable data point.
encoder:
  model_name: bert-base-cased
decoder:
  model_name: Qwen/Qwen2.5-1.5B
  use_lora: true            # keep LoRA (your recipe) — Qwen uses q_proj/v_proj, which
  # the LoRA target selector already handles. Small model → stable at lr=1e-3.
  kv_fanout_len: 50         # fan-out (M read-points into z).
  fanout_mode: prefix       # EMPIRICAL: on Qwen, prefix beat the RoPE-aware "kv"
  # path at matched steps (BLEU ~4.0 vs ~2.7 @ 4k; f1 tied). The kv path's ~92M
  # kv_proj (vs prefix's ~10M) optimizes slower/noisier and didn't pay off within
  # budget. "kv" is RoPE-correct (verified) and available if you train much longer.
  torch_dtype: float32      # 1.5B in fp32 fits fine on an A100 and matches the GPT-2
  # combo's precision (no bf16 confound). Switch to bfloat16 if you want it lighter.
vae_training:
  dataset: entailment_bank
  batch_size: 32            # 1.5B + LoRA + zforce pass; 32 is a solid A100 default
  # (bump to 50 to match the GPT-2 combo if memory allows, or add grad_accum_steps).
  word_dropout: 0.3         # LOWERED (was 0.9) for the consistency recipe: the MAIN
  # pass is now the TEACHER for self-distillation, so it needs real gold context to
  # be fluent. z-forcing no longer comes from starving the main pass — it comes from
  # the z-only pass (zforce) + the consistency term below.
  zforce_weight: 1.0        # keep the HARD-gold z-only anchor (a second decode with
  # all inputs blanked, reconstructing from z alone).
  consistency_weight: 1.0   # NEW — self-distillation z-forcing. Distills the fluent
  # main pass into the z-only pass: KL(stopgrad(softmax(main)) || softmax(zonly)),
  # reusing the SAME z-only forward as zforce (no extra pass). Matches the z-only
  # pass to the teacher's FULL distribution (richer than the hard gold token) so z
  # must carry enough to reproduce the teacher's fluency. Sweep 0.5/1.0/2.0.
  consistency_temp: 1.0     # softmax temperature; try 2.0 to expose more soft
  # structure ("dark knowledge") if 1.0 is too weak.
