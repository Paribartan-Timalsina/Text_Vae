# Combo: BERT encoder + Mistral-7B-v0.3 decoder.
# Layer OVER base.yaml + default.yaml. Needs a large GPU (A100-80GB recommended).
# GATED model: `huggingface-cli login` + accept the Mistral-7B-v0.3 license first.
encoder:
  model_name: bert-base-cased
decoder:
  model_name: mistralai/Mistral-7B-v0.3
  use_lora: false           # NO LoRA: fully frozen decoder + trainable injection only
  # (LangVAE's regime). Avoids the LoRA-on-big-decoder instability; also the "-LoRA"
  # ablation.
  kv_fanout_len: 50         # fan-out (M read-points into z).
  fanout_mode: prefix       # RoPE-safe prefix fan-out (default, matches the Qwen
  # finding that prefix ≥ RoPE-aware "kv" at matched budget). "kv" is RoPE-correct
  # (verified; kv_proj ~423M) and available for a long-training ablation.
  torch_dtype: bfloat16     # 7B in bf16 (~14GB) fits on an A100-80GB (and usually
  # 40GB). Injected tensors cast to bf16. If you OOM, set load_in_4bit: true
  # (QLoRA) — see combos/README.md for the .to(device) caveat.
  load_in_4bit: false
  device_map: null
vae_training:
  dataset: entailment_bank
  batch_size: 8             # 7B is heavy; keep batch 8 (raise if the A100-80GB allows).
  learning_rate: 1.0e-3     # LangVAE's LR. Stable now that only kv_proj trains (frozen
  # decoder). If latent/z_std spikes early, drop to 3e-4.
  grad_clip_max_norm: 1.0   # safety rail.
  warmup_steps: 1000        # ease the large from-scratch kv_proj in.
