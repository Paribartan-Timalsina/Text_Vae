# Ablation: KV-only channel, capped to a dedicated 32-dim latent slice.
# Layer this OVER base.yaml + default.yaml + combos/bert_gpt2.yaml:
#   python -m src.pipelines.train_vae \
#       --config configs/base.yaml configs/vae/default.yaml \
#                configs/vae/combos/bert_gpt2.yaml \
#                configs/vae/combos/bert_gpt2_kvonly_split32.yaml
#
# Paired with bert_gpt2_split_all3.yaml: this run reserves the SAME 32-dim KV
# slice out of latent_dim=128 (channel_split_dims: [48, 48, 32]) but leaves the
# 48+48 prefix/embedding dims unused (prefix_inject/latent_pos_inject off) —
# i.e. same KV capacity as the all-3 run, with the rest of the budget idle. Not
# comparable to the old "Only KV = 67 BLEU" row, which used the FULL 128-dim
# latent for KV — this establishes the matched-capacity baseline for the all-3
# comparison instead.
decoder:
  prefix_inject: false
  latent_pos_inject: false
  deep_inject: true
  split_latent_channels: true
  channel_split_dims: [48, 48, 32]
