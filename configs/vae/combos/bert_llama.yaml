# Combo: BERT encoder + Llama-3.2-3B decoder.
# Layer OVER base.yaml + default.yaml. Needs a large GPU (A100). GATED model:
# run `huggingface-cli login` and accept the Llama-3.2 license on HF first.
encoder:
  model_name: bert-base-cased
decoder:
  model_name: meta-llama/Llama-3.2-3B
  use_lora: false           # NO LoRA: fully frozen decoder + trainable injection only
  # (LangVAE's exact regime). LoRA on a 3B decoder at batch 8 diverged; dropping it
  # removes the instability. This run is also the "-LoRA" ablation.
  kv_fanout_len: 50         # fan-out (M read-points into z).
  fanout_mode: prefix       # RoPE-safe prefix fan-out. On Qwen, prefix beat the
  # RoPE-aware "kv" path at matched budget, so it's the default here too. Switch to
  # "kv" (RoPE-correct, verified; kv_proj ~370M) only for a long-training ablation.
  torch_dtype: bfloat16     # 3B in bf16 (~6GB) fits comfortably on an A100; the
  # injected latent tensors are cast to bf16 to match. Works with the pipeline's
  # .to(device). For a smaller GPU set load_in_4bit: true (see combos/README.md).
  load_in_4bit: false
  device_map: null
vae_training:
  dataset: entailment_bank
  batch_size: 16            # no LoRA frees memory → larger batch = smoother gradients
  # (closer to LangVAE's 50). Drop to 8 if you OOM.
  learning_rate: 1.0e-3     # LangVAE's LR. Stable now that the only trainable big
  # module is kv_proj (frozen decoder). If latent/z_std spikes early, drop to 3e-4.
  grad_clip_max_norm: 1.0   # safety rail against gradient spikes.
  warmup_steps: 1000        # ease the large from-scratch kv_proj in.
