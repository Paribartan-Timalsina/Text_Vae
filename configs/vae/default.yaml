# VAE architecture and training configuration
#
# Architecture (post-rewrite): a FROZEN pretrained encoder (BERT) + FROZEN
# pretrained causal-LM decoder (GPT-2), LangVAE-style. Only the Perceiver pool,
# variational heads, latent-injection projections (and optional LoRA) are
# trained. This is the fix for the from-scratch-decoder gibberish — a pretrained
# LM already produces fluent text, so the VAE only learns to read/write z.
vae_arch:
  latent_dim: 16 # Per-token dim. MULTI-TOKEN at matched rate: K=8 × D=16 = 128
  # total dims (same operating point as (1,128)), but the decoder now gets 8 KV
  # slots/layer + 8 prefix tokens instead of 1 → ~8× bandwidth to read the same
  # ~2-nat latent. Novel (multi-token) vs LangVAE's single-vector fan-out.
  embed_dim: 768 # (Unused by the frozen backbones; kept for config compat.)
  num_layers: 4 # (Unused — encoder is a frozen pretrained backbone now.)
  num_heads: 8 # Heads for the Perceiver cross-attention pool (768/8 = 96).
  dropout: 0.1 # Dropout for the Perceiver pool.
  max_answer_len: 50 # Max answer length on the ENCODER (BERT) side.
  num_latent_tokens: 8 # K=8 (×D=16 = 128 total). 8 latent tokens → 8 KV slots per
  # decoder layer = ~8× the latent→decoder bandwidth of K=1, at the same ~2-nat
  # rate. THE bandwidth fix. Bump to 16 if BLEU still trails after this.
  latent_pos_inject: true # (Kept for compat; the decoder reads decoder.latent_pos_inject.)
  use_bow_head: false # BoW anti-collapse head — OFF (a frozen pretrained decoder
  # no longer collapses the way the from-scratch one did). Re-enable only if
  # val/f1_gap stays ~0.

decoder:
  model_name: gpt2 # Frozen pretrained causal LM (the generator). Paper's highest
  # reconstruction row (BERT+GPT-2). Scale to Qwen/Qwen2.5-1.5B as an ablation.
  max_answer_len: 50 # Max decoder tokens (reconstruction target length).
  latent_pos_inject: true # Add a K-pooled projection of z to every decoder token
  # embedding so z is reachable at each step and cannot be bypassed.
  use_lora: true # LoRA on the decoder. A fully frozen GPT-2 has no trainable
  # path to learn to READ the injected latent, so it bypasses z and generates
  # from its prior (fluent but unrelated text, val/f1_gap≈0.03). LoRA gives it
  # that path — the primary cure for strong-decoder latent bypass. <1% params.
  lora_r: 32 # 16→32 + MLP targets (c_fc/c_proj): more trainable capacity to
  # integrate the much larger deep-injected latent signal.
  lora_alpha: 64
  lora_dropout: 0.05
  deep_inject: true # Per-layer KV injection (Optimus/LangVAE style): K latent
  # memory slots in EVERY decoder layer's attention, on top of the input prefix.
  # ~12× the z→decoder bandwidth — the main architectural lever for BLEU ~90.

vae_training:
  dataset: squad_v2 # "squad_v2" (short answers, has NULLs) or "entailment_bank"
  # (LangVAE paper corpus). SQuAD QA is the primary downstream task here.
  learning_rate: 1.0e-3 # AdamW peak LR (paper §5.1: LR=0.001). Only the small
  # trained heads/adapters see gradients, so a higher LR than a full-model train.
  batch_size: 50 # Paper §5.1 batch size.
  epochs: 100 
  patience: 10 # Early-stopping patience (val checks).
  warmup_steps: 500 # LR warmup steps.
  weight_decay: 0.01 # AdamW weight decay (applies to trained heads only).
  grad_clip_max_norm: 5.0 # 1.0 clipped a ~38 pre-clip grad_norm ~38x → effective
  # LR throttled, convergence crawled. 5.0 lets gradients through while still
  # catching spikes.
  grad_accum_steps: 1
  # --- KL regime: standard VAE (beta=1, cyclical annealing) ---
  beta_start: 0.0 # KL weight at the start of warmup.
  beta_end: 0.5 # max_beta for CYCLICAL annealing. With target_kl=2.0 (flat) the
  # hinge pulls the single latent toward ~2 nats (LangVAE's rate). 0.5 (vs
  # LangVAE's 1.0) is GENTLER → lower collapse risk; KL may settle a bit above 2
  # nats (~2–4), which is fine. Raise toward 1.0 if true_kl stays well above 2.
  beta_warmup_steps: 5000 # (monotonic schedule only)
  beta_schedule: cyclical # CYCLICAL annealing (Fu 2019), matching LangVAE's ~40
  # cycles. At low rate a MONOTONIC ramp crushes the latent to the prior before
  # the frozen decoder learns to read it (KL-vanishing → recon collapse, the
  # BLEU~20 we saw). Cyclical drops beta to ~0 each cycle so the decoder relearns
  # z. PRIMARY fix for low-rate reconstruction. (Was monotonic for high-rate.)
  beta_cycles: 40 # (unused with monotonic)
  beta_cycle_ratio: 0.5 # (unused with monotonic)
  free_bits: 0.2 # PER-DIM KL floor (anti-monopoly) for the K-slot bandwidth test.
  # Per-slot floor = 0.2×D = 3.2 nats → every one of the 8 slots is FORCED to hold
  # ≥3.2 nats → no slot-0 monopoly, all 8 KV slots strongly used (real bandwidth).
  # Total floor = 0.2×128 = 25.6 nats, just under the ~31 the model reaches at
  # beta_end=0.5, so it spreads the budget without inflating the rate. NOTE: if
  # this run's natural KL is < 25.6, the floor will PIN true_kl up to ~25.6 — watch
  # train/true_kl; lower free_bits (→0.15) if you want the rate left untouched.
  ema_decay: 0.999
  target_kl: 2.0 # KL hinge target ≈ 2 nats TOTAL (single vector → matches
  # LangVAE's rate). KL below 2 is free, above is penalised at beta.
  val_every_n_steps: 500
  noise_aug_sigma: 0.0 # Diffusion-time robustness; enable (~0.1) only after f1_gap
  # confirms z is used.
  noise_aug_prob: 0.0
  null_train_fraction: 0.10 # Keep 10% NULL / 90% answerable in VAE training (SQuAD).
  null_loss_weight: 0.1 # Downweight NULL reconstruction loss.
  word_dropout: 0.7 # THE anti-bypass for the 2-nat regime. At 0.7, ~70% of
  # teacher-forced input tokens are blanked (→ learned mask embed, see decoder.py)
  # so the decoder must reconstruct from z + GPT-2 positions → forces z-usage in
  # ONE parallel pass (cheap stand-in for free-running). Sweep 0.5/0.7/0.9.
  bow_loss_weight: 0.0 # OFF (reserve lever; requires use_bow_head).
  zforce_weight: 0.5 # Reinforce z-only reconstruction (second decode with all
  # inputs blanked) alongside word_dropout=0.7. Both push the decoder to rely on
  # z at ~2 nats. Sweep down to 0 if it over-constrains.

quality_gate:
  min_recon_accuracy: 0.85 # Min token-level reconstruction accuracy
  min_mean_kl: 1.0 # Min mean KL to avoid posterior collapse (trivially passed
  # in the near-AE regime — KL should sit in the hundreds of nats)
  min_active_dims: 64 # Min latent dims with variance > threshold (~6% of K*D = 16*64 = 1024)
  min_centroid_distance: 0.5 # Min L2 between answerable/unanswerable centroids
  active_dim_variance_threshold: 0.1 # Variance cutoff for "active" dimension
  max_dead_slots: 0 # Max latent slots with zero active dims (per-slot collapse)
  min_active_in_any_slot: 1 # Each of the K slots must have ≥ this many active dims
