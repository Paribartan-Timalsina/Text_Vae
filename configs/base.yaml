# Base configuration — shared across all pipelines
seed: 42

paths:
  data_dir: "data"
  checkpoint_dir: "checkpoints"
  latent_dir: "latents"
  output_dir: "outputs"

encoder:
  model_name: "bert-base-uncased"    # Pretrained encoder model
  hidden_dim: 768                     # Must match model's hidden size
  max_context_len: 384                # Max tokens for context passage
  max_question_len: 64                # Max tokens for question
  unfreeze_top_n: 0                   # Keep entire encoder frozen (LangVAE setting,
  # keeps the comparison like-for-like). Unfreezing the top 2 BERT layers at the
  # adapter LR (1e-3, ~100x too hot for pretrained weights) degraded results: the
  # encoder took a low-KL shortcut (kl_per_dim 0.36→0.25, dead_dims up, BLEU
  # behind at 3k steps). The encoder is NOT the lever to touch.
